[project]
name = "polysight-seg"
version = "0.1.0"
description = "Entrenamiento reproducible de modelos para segmentación de pólipos"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "albumentations==1.4.24",
    "mlflow==3.15.1",
    "numpy==1.26.4",
    "opencv-python-headless==4.10.0.84",
    "pillow==10.4.0",
    "pyyaml==6.0.2",
    "segmentation-models-pytorch==0.3.4",
    "torchmetrics==1.3.2",
    "tqdm==4.66.5",
]

[project.scripts]
polysight-seg = "polysight_seg.cli:main"

[build-system]
requires = ["setuptools>=69,<76"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
