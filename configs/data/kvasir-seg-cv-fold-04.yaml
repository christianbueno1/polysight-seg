schema_version: 1
dataset:
  name: kvasir-seg-cv-fold-04
  root: data/raw/kvasir-seg
  manifest: data/processed/kvasir-seg/manifest.csv
  splits: data/processed/kvasir-seg/cross-validation/fold-04/splits.csv
  mask_threshold: 128
loader:
  batch_size: 8
  num_workers: 4
  pin_memory: true
  persistent_workers: true
input:
  height: 256
  width: 256
  image_interpolation: bilinear
  mask_interpolation: nearest
normalization:
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
transforms:
  train:
    horizontal_flip_probability: 0.5
    vertical_flip_probability: 0.5
    rotate_limit_degrees: 15
    rotate_probability: 0.5
    brightness_contrast_probability: 0.3
  validation:
    random_augmentations: false
  test:
    random_augmentations: false
